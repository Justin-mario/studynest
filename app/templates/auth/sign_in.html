{% extends "base.html" %}
{% block title %}Sign in &mdash; StudyNest{% endblock %}
{% block content %}
<section class="mx-auto max-w-sm py-8">
  <h1 class="text-2xl font-semibold">Sign in</h1>
  <form method="post" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="handle" class="block text-sm font-medium">Handle</label>
      <input id="handle" name="handle" type="text" autocomplete="username" required
             class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
    </div>
    <div>
      <label for="password" class="block text-sm font-medium">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required
             class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
    </div>
    <button type="submit" class="w-full rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700">Sign in</button>
  </form>
</section>
{% endblock %}
