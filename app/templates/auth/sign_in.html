{% extends "base.html" %}
{% block title %}Sign in &mdash; StudyNest{% endblock %}
{% block content %}
<div class="container" style="padding-top: 32px;">
  <div class="card auth-card">
    <div class="t-eyebrow">Welcome back</div>
    <h1 class="t-h2 mt-2">Sign in</h1>
    <p class="t-small mt-2">Use the handle and password your tutor gave you.</p>

    <form method="post" class="mt-6">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="handle">Handle</label>
        <input id="handle" name="handle" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-blue" style="width: 100%; justify-content: center;">Sign in</button>
    </form>

    <p class="t-small mt-6" style="text-align: center;">
      Don't have an account? Ask your tutor to set one up.
    </p>
  </div>
</div>
{% endblock %}
