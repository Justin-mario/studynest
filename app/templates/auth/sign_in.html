{% extends "base.html" %}
{% block title %}Sign in &mdash; StudyNest{% endblock %}
{% block content %}
<div class="container" style="padding-top: 32px;">
  <div class="card auth-card">
    <div class="t-eyebrow">Welcome back</div>
    <h1 class="t-h2 mt-2">Sign in</h1>
    <p class="t-small mt-2">Use the username and password your tutor gave you.</p>

    <form method="post" class="mt-6" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% if request.args.get('next') %}
        <input type="hidden" name="next" value="{{ request.args.get('next') }}">
      {% endif %}
      <div class="field">
        <label for="handle">Username</label>
        <input id="handle" name="handle" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-blue" style="width: 100%; justify-content: center;">
        Sign in
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <p class="t-small mt-6" style="text-align: center;">
      Don't have an account? Ask your tutor to set one up.
    </p>
  </div>
</div>
{% endblock %}
