{% extends "base.html" %}
{% block title %}Change password &mdash; StudyNest{% endblock %}
{% block content %}
<section class="mx-auto max-w-sm py-8">
  <h1 class="text-2xl font-semibold">Change your password</h1>
  <p class="mt-2 text-sm text-slate-600">Choose a new password before continuing.</p>
  <form method="post" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="current_password" class="block text-sm font-medium">Current password</label>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password" required
             class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
    </div>
    <div>
      <label for="new_password" class="block text-sm font-medium">New password</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" required
             class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
    </div>
    <button type="submit" class="w-full rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700">Update password</button>
  </form>
</section>
{% endblock %}
