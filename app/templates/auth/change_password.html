{% extends "base.html" %}
{% block title %}Change password &mdash; StudyNest{% endblock %}
{% block content %}
<div class="container" style="padding-top: 32px;">
  <div class="card auth-card">
    <div class="t-eyebrow">Account</div>
    <h1 class="t-h2 mt-2">Choose a new password</h1>
    <p class="t-small mt-2">Required on first sign-in and after a reset.</p>

    <form method="post" class="mt-6">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="current_password">Current password</label>
        <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="10">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
