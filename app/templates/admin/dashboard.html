</section>

<section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">

  <article class="rounded-lg border border-slate-200 bg-white p-5">
    <h2 class="text-sm font-medium text-slate-500">Cohorts</h2>
    <p class="mt-2 text-2xl font-semibold">&mdash;</p>
  </article>
  <article class="rounded-lg border border-slate-200 bg-white p-5">
    <h2 class="text-sm font-medium text-slate-500">Recent activity</h2>
