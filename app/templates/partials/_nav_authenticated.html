<header class="border-b border-slate-200 bg-white">
  <nav class="mx-auto flex max-w-5xl flex-wrap items-center gap-4 px-4 py-3 text-sm" aria-label="Primary">
    <a href="{{ url_for('dashboard.index') if current_user.role == 'student' else url_for('admin.index') }}" class="text-lg font-semibold">StudyNest</a>
    {% if current_user.role == 'student' %}
      <a href="{{ url_for('core_paper.index') }}" class="hover:underline">Core Paper</a>
      <span class="text-slate-400" aria-hidden="true">ESP</span>
      <span class="text-slate-400" aria-hidden="true">OS</span>
      <a href="{{ url_for('revision.index') }}" class="hover:underline">Revision</a>
      <a href="{{ url_for('explainit.index') }}" class="hover:underline">ExplainIT</a>
      <a href="{{ url_for('exam_technique.index') }}" class="hover:underline">Exam Technique</a>
    {% else %}
      <a href="{{ url_for('admin.cohorts') }}" class="hover:underline">Cohorts</a>
      <a href="{{ url_for('admin.students') }}" class="hover:underline">Students</a>
      <a href="{{ url_for('admin.analytics') }}" class="hover:underline">Analytics</a>
      <a href="{{ url_for('admin.settings') }}" class="hover:underline">Settings</a>
    {% endif %}
    <form method="post" action="{{ url_for('auth.sign_out') }}" class="ml-auto">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="text-slate-600 hover:underline">Sign out</button>
    </form>
  </nav>
</header>
