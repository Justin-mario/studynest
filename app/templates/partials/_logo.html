{# Logo SVG — matches reference design exactly. Pass mono=True for the dark-on-dark variant. #}
{% macro logo(size=28, mono=False) -%}
  {% set fg = "currentColor" if mono else "#14120D" %}
  {% set accent = "currentColor" if mono else "#FF6A2C" %}
  <svg width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-label="StudyNest" style="display:block">
    <rect x="2" y="2" width="28" height="28" rx="8" fill="{{ fg }}"/>
    <path d="M9 21 V12 a3 3 0 0 1 3-3 h2 a3 3 0 0 1 3 3 v4" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="20.5" cy="20.5" r="2.4" fill="{{ accent }}"/>
  </svg>
{%- endmacro %}
